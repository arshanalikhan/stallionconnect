# Builds a static preview of the site and publishes it to GitHub Pages
# (served from the gh-pages branch). Production hosting will be Cloudflare.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/modest-euler-dz9n9e]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Two previews side by side for comparing backgrounds:
      #   /<repo>/          network backdrop (default in src/config/site.ts)
      #   /<repo>/journey/  journey backdrop (Earth, India, Aligarh, office)
      #   /<repo>/light/    light-themed network backdrop
      - name: Build journey preview
        run: npm run build:pages && mv out journey-out
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/journey
          NEXT_PUBLIC_BACKGROUND: journey3d

      - name: Build light preview
        run: npm run build:pages && mv out light-out
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/light
          NEXT_PUBLIC_BACKGROUND: light3d

      - name: Build main preview
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Combine previews
        run: |
          test ! -e out/journey  # must not clash with a public/ folder
          mv journey-out out/journey
          test ! -e out/light
          mv light-out out/light
          touch out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy preview from ${{ github.ref_name }}"
